services:
  postgres:
    image: postgres:16
    container_name: drone-delivery-postgres
    environment:
      POSTGRES_DB: drone_delivery
      POSTGRES_USER: drone
      POSTGRES_PASSWORD: drone
    ports:
      - "5432:5432"
    volumes:
      - drone_delivery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone -d drone_delivery"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  drone_delivery_postgres_data:
