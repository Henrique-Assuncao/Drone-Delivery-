spring.datasource.url=jdbc:postgresql://localhost:5432/drone_delivery
spring.datasource.username=drone
spring.datasource.password=drone

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

drone.internal.api-key=${DRONE_INTERNAL_API_KEY:dev-internal-key}
drone.client-auth.secret=${DRONE_CLIENT_AUTH_SECRET:dev-client-auth-secret-change-me}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.urls-primary-name=backend-completo
